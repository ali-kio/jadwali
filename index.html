<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light" data-accent="pearl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#faf5ea" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)" />
<meta name="description" content="جدولك الجامعي، محاضراتك، اختباراتك النهائية، وغياباتك — في مكان واحد يشتغل بدون إنترنت." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="جدولي" />

<title>جدولي — منظّم الفصل الدراسي</title>

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/icons/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/views.css" />
</head>

<body>
<a class="skip-link" href="#view">تخطَّ إلى المحتوى</a>

<div class="shell">

  <!-- ===== الشريط الجانبي (شاشات كبيرة) ===== -->
  <aside class="rail" aria-label="التنقل">
    <a class="rail-brand" href="#/home" data-link>
      <span class="rail-mark" aria-hidden="true"></span>
      <span class="rail-name">جدولي</span>
    </a>

    <nav class="rail-nav">
      <a href="#/home"     data-link data-nav="home"><i data-i="home"></i><span>الرئيسية</span></a>
      <a href="#/schedule" data-link data-nav="schedule"><i data-i="calendar"></i><span>الجدول</span></a>
      <a href="#/exams"    data-link data-nav="exams"><i data-i="clipboard"></i><span>الاختبارات</span></a>
      <a href="#/courses"  data-link data-nav="courses"><i data-i="library"></i><span>المقررات</span></a>
      <a href="#/adhkar"   data-link data-nav="adhkar"><i data-i="sparkle"></i><span>الأذكار</span></a>
      <a href="#/settings" data-link data-nav="settings"><i data-i="settings"></i><span>الإعدادات</span></a>
    </nav>

    <div class="rail-foot">
      <button class="btn btn-soft btn-block" data-act="add-course"><i data-i="plus"></i><span>أضف مقرر</span></button>
      <div class="rail-theme" role="group" aria-label="المظهر">
        <button data-act="theme" data-theme-val="light" title="فاتح"><i data-i="sun"></i></button>
        <button data-act="theme" data-theme-val="dark" title="داكن"><i data-i="moon"></i></button>
        <button data-act="theme" data-theme-val="auto" title="حسب النظام"><i data-i="monitor"></i></button>
      </div>
    </div>
  </aside>

  <!-- ===== العمود الرئيسي ===== -->
  <div class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="page-title">الرئيسية</h1>
        <p id="page-sub"></p>
      </div>
      <div class="topbar-tools">
        <button class="icon-btn" data-act="search" aria-label="بحث"><i data-i="search"></i></button>
        <button class="icon-btn only-mobile" data-act="cycle-theme" aria-label="تبديل المظهر"><i data-i="sun" data-theme-icon></i></button>
        <a class="icon-btn only-mobile" href="#/settings" data-link data-nav="settings" aria-label="الإعدادات"><i data-i="settings"></i></a>
        <button class="icon-btn" data-act="add-course" aria-label="أضف مقرر"><i data-i="plus"></i></button>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="تنقل سريع">
      <a href="#/home"     data-link data-nav="home"><i data-i="home"></i><span>الرئيسية</span></a>
      <a href="#/schedule" data-link data-nav="schedule"><i data-i="calendar"></i><span>الجدول</span></a>
      <a href="#/exams"    data-link data-nav="exams"><i data-i="clipboard"></i><span>اختبارات</span></a>
      <a href="#/courses"  data-link data-nav="courses"><i data-i="library"></i><span>مقررات</span></a>
      <a href="#/adhkar"   data-link data-nav="adhkar"><i data-i="sparkle"></i><span>أذكار</span></a>
    </nav>
  </div>
</div>

<!-- طبقات عائمة -->
<div id="sheet-layer" class="layer" hidden>
  <div class="layer-veil" data-act="close-sheet"></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header class="sheet-head">
      <span class="sheet-grip" aria-hidden="true"></span>
      <h2 id="sheet-title">—</h2>
      <button class="icon-btn" data-act="close-sheet" aria-label="إغلاق"><i data-i="x"></i></button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
    <footer class="sheet-foot" id="sheet-foot" hidden></footer>
  </section>
</div>

<div id="search-layer" class="layer" hidden>
  <div class="layer-veil" data-act="close-search"></div>
  <section class="finder" role="dialog" aria-modal="true" aria-label="بحث">
    <div class="finder-head">
      <i data-i="search"></i>
      <input id="finder-input" type="search" placeholder="ابحث عن مقرر، محاضرة، اختبار، قاعة…" autocomplete="off" />
      <button class="icon-btn" data-act="close-search" aria-label="إغلاق"><i data-i="x"></i></button>
    </div>
    <div class="finder-results" id="finder-results"></div>
  </section>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="js/icons.js"></script>
<script src="js/utils.js"></script>
<script src="js/store.js"></script>
<script src="js/catalog.js"></script>
<script src="js/adhkar.js"></script>
<script src="js/ucs.js"></script>
<script src="js/ui.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
